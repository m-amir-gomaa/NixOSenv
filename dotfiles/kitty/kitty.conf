font_family JetBrainsMono Nerd Font Mono
font_size 16.0
window_margin_width 10

# background_image ~/Downloads/nihilist_penguin.png
# background_image_layout scaled
# background_tint only applies when a background_image is set.
# 0.0 = fully transparent (image only), 1.0 = fully opaque (no image visible).
background_tint 0.8
# background_tint_gaps -10.0

# 1pt = 1 CSS point; on a 96 dpi screen this is 1 physical pixel.
window_border_width 1pt

# active_border_color #44ffff
single_window_margin_width 0

# Tall = one tall main pane on the left, remaining windows stack on the right.
# * = fallback to any other layout for windows that don't fit Tall.
enabled_layouts Tall, *

# F1 opens a new window in the same working directory as the current window.
map f1 new_window_with_cwd
# F2 launches $EDITOR in the current window's directory (quick file edit).
map f2 launch --cwd=current $EDITOR .

tab_bar_style powerline
tab_powerline_style slanted

enable_audio_bell no

# Window movement (re-order panes within the kitty OS window)
map shift+left  move_window right
map shift+down  move_window up
map shift+right move_window left
map shift+up    move_window down

# Window focus (move keyboard focus between panes)
map ctrl+left  neighboring_window left
map ctrl+down  neighboring_window down
map ctrl+right neighboring_window right
map ctrl+up    neighboring_window up

# Jump to the previously focused window (like Alt+Tab but for panes)
map ctrl+p nth_window -1


# BEGIN_KITTY_THEME
# Dark One Nuanced
include current-theme.conf
# END_KITTY_THEME

# Start maximised (Hyprland will respect the initial-size hint)
 kitty --start-as maximized

# -3.0 = never hide the mouse cursor (positive values = hide after N seconds)
 mouse_hide_wait        -3.0

# Remove the OS title bar (Hyprland draws its own border/decoration)
 hide_window_decorations yes

# Send a desktop notification when a long-running command finishes while the
# terminal is not the focused window ("invisible" = only notify if not visible)
 notify_on_cmd_finish invisible

# Disable Ctrl+P (used as a Neovim binding) in kitty so it doesn't conflict
map ctrl+p no_op
